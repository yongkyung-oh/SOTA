[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sota-counter-reproduction"
version = "0.1.0"
description = "Reproduce SOTA mention counts, Figure 1, and Appendix A tables."
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
]

[project.scripts]
sota-counter = "sota_counter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
